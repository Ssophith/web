<!Doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <title>Цагийн ажлын систем – Нэвтрэх / Бүртгүүлэх</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background: #fff;
        width: 360px;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        margin-bottom: 16px;
      }
      input,
      select,
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .toggle {
        text-align: center;
        margin-top: 10px;
        color: #2563eb;
        cursor: pointer;
        font-size: 14px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">Нэвтрэх</h2>

      <form id="authForm">
        <div id="registerFields" class="hidden">
          <input type="text" id="name" placeholder="Нэр" />
          <select id="type">
            <option value="Хувь хүн">Хувь хүн</option>
            <option value="Байгууллага">Байгууллага</option>
          </select>
        </div>

        <input type="text" id="phone" placeholder="Утасны дугаар" required />
        <input type="password" id="password" placeholder="Нууц үг" required />

        <button type="submit">Нэвтрэх</button>
      </form>

      <div class="toggle" id="toggleBtn">Бүртгүүлэх</div>
    </div>

    <script>
      const toggleBtn = document.getElementById("toggleBtn");
      const title = document.getElementById("title");
      const registerFields = document.getElementById("registerFields");
      const form = document.getElementById("authForm");
      const button = form.querySelector("button");

      let isLogin = true;

      toggleBtn.addEventListener("click", () => {
        isLogin = !isLogin;
        title.textContent = isLogin ? "Нэвтрэх" : "Бүртгүүлэх";
        button.textContent = isLogin ? "Нэвтрэх" : "Бүртгүүлэх";
        toggleBtn.textContent = isLogin ? "Бүртгүүлэх" : "Нэвтрэх";
        registerFields.classList.toggle("hidden");
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          name: document.getElementById("name").value,
          type: document.getElementById("type").value,
          phone: document.getElementById("phone").value,
          password: document.getElementById("password").value,
        };

        try {
          if (isLogin) {
            // Нэвтрэх хүсэлт
            const res = await fetch("http://localhost:3000/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                phone: data.phone,
                password: data.password,
              }),
            });
            const result = await res.json();
            console.log("LOGIN RESPONSE:", result);
            alert(result.message || "Нэвтрэх хүсэлт илгээгдлээ");
          } else {
            // Бүртгүүлэх хүсэлт
            const res = await fetch("http://localhost:3000/api/auth/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            const result = await res.json();
            console.log("REGISTER RESPONSE:", result);
            alert(result.message || "Бүртгүүлэх хүсэлт илгээгдлээ");
          }
        } catch (err) {
          console.error(err);
          alert("Алдаа гарлаа");
        }
      });
    </script>
  </body>
</html>
